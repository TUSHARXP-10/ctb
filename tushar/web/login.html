<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tushar.ai · Sign in</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <meta name="theme-color" content="#07090f">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tushar.ai">

  <style>
    .wrap { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
    .box { width: min(380px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 28px; text-align: center; }
    .box input { width: 100%; margin: 18px 0 12px; background: var(--bg2); border: 1px solid var(--line2); color: var(--text); border-radius: 10px; padding: 11px 12px; font-size: 14px; }
    .box .btn { width: 100%; justify-content: center; padding: 11px; }
    .err { color: var(--red); font-size: 13px; min-height: 18px; margin-top: 10px; }
  </style>
</head>
<body>
<div class="wrap">
  <form class="box" id="f">
    <div class="logo" style="margin:0 auto 12px;width:48px;height:48px;font-size:24px">T</div>
    <div class="brand-name" style="font-size:24px">Tushar<span>.ai</span></div>
    <div class="muted" style="font-size:13px;margin-top:4px">Claude is the trader</div>
    <input type="password" id="pw" placeholder="Access key (shown in the PC window)" autofocus autocomplete="current-password" inputmode="text">
    <button class="btn primary" type="submit">Sign in</button>
    <div class="err" id="err"></div>
  </form>
</div>
<script>
  const params = new URLSearchParams(location.hash.slice(1));
  const next = (params.get("next") || "/").startsWith("/") ? (params.get("next") || "/") : "/";
  async function login(pw) {
    const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ password: pw }) });
    if (r.ok) { location.replace(next); return; }
    const d = await r.json().catch(() => ({}));
    document.getElementById("err").textContent = r.status === 429 ? "Too many attempts. Wait 10 minutes." : (d.error === "wrong password" ? "Wrong access key" : "Login failed");
  }
  document.getElementById("f").addEventListener("submit", (e) => { e.preventDefault(); login(document.getElementById("pw").value.trim()); });
  if (params.get("k")) { history.replaceState(null, "", "/login"); document.getElementById("pw").value = params.get("k"); login(params.get("k")); }
</script>
</body>
</html>
